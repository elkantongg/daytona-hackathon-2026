[project]
name = "wayfound-backend"
version = "0.1.0"
description = "Wayfound API: constraint-aware venue recovery (FastAPI + Neo4j + Daytona)"
requires-python = ">=3.12"
dependencies = [
    "daytona>=0.227.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
